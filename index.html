<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full stack development with login and registration</title>
    <link rel="stylesheet" href="styling.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> rel="stylesheet">" 
</head>
<body>
    <video class="bg-video" autoplay muted loop>
        <source src="video.mp4" type="video/mp4">
    </video>

    <header>
        <a href="#" class="logo">Wanderbee</a>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
        <div class="user-auth">
            <div class="Profile-box" style="display:none">
                <div class="Avatar-circle">C</div>
                <div class="Dropdown">
                    <a href="#">My account</a>
                    <a href="#">Logout</a>
                </div>
            </div>
            <button type="button" class="login-btn-modal">Login</button>
        </div>
    </header>

    <div class="alert-box">
    <div class="alert Alert-success">
        <i class="bx bx-check"></i> 
        <span>Registration successful!</span>
    </div>
</div>

<div class="auth-modal">
    <button type="button" class="close-btn-modal"><i class="bx bx-x"></i></button>
    <div class="form-box login">
        <h2>Login</h2>
        <form action="">
            <div class="input-box">
                <input type="email" name="email" placeholder="Email" required>
                <i class="bx bx-envelope"></i>
            </div>
            <div class="input-box">
                <input type="password" name="password" placeholder="Password" required>
                <i class="bx bx-lock-alt"></i>
            </div>
            <button type="submit" name="login-btn" class="btn">Login</button>
            <p>Don't have an account? <a href="#" class="register-link">Register</a></p>
        </form>
    </div>

    <div class="form-box register">
        <h2>Register</h2>
        <form action="">
            <div class="input-box">
                <input type="text" name="name" placeholder="Name" required>
                <i class="bx bx-user"></i>
            </div>
            <div class="input-box">
                <input type="email" name="email" placeholder="Email" required>
                <i class="bx bx-envelope"></i>
            </div>
            <div class="input-box">
                <input type="password" name="password" placeholder="Password" required>
                <i class="bx bx-lock-alt"></i>
            </div>
            <button type="submit" name="register-btn" class="btn">Register</button>
            <p>Already have an account? <a href="#" class="login-link">Login</a></p>
        </form>
    </div>
</div>

    </div>

    <script src="script.js"></script>
</body>
</html>
